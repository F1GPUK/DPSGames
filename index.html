<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPS Games</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--text:#1d1b2e;--muted:#6b6880;--accent:#6c4cf5;--accent2:#ff5c8a;--line:#e4e1f0;--danger:#d93a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111f;--card:#1e1b30;--text:#f1eefc;--muted:#9a96b5;--line:#322e4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13111f;--card:#1e1b30;--text:#f1eefc;--muted:#9a96b5;--line:#322e4d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
nav{display:flex;gap:8px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger)}
button:disabled{opacity:.5;cursor:default}
main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.cover{aspect-ratio:16/10;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.card .body{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.player{background:#000;border-radius:14px;overflow:hidden;margin:16px 0}
.player iframe{width:100%;height:min(70vh,640px);border:0;display:block;background:#000}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.msg{margin-top:12px;font-size:14px}.err{color:var(--danger)}.ok{color:#1f9d55}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">🎮 DPS Games</div>
  <nav><button class="ghost" id="adminBtn" hidden>Admin panel</button><button class="ghost" id="profBtn" hidden>My profile</button><button class="ghost" id="outBtn" hidden>Log out</button></nav>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
window.addEventListener('error',function(e){var b=document.getElementById('dpsErr');if(!b){b=document.createElement('div');b.id='dpsErr';b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#d93a3a;color:#fff;padding:8px 12px;font:13px system-ui;z-index:9999';document.body.appendChild(b);}b.textContent='Error: '+(e.message||'unknown');});
var MAX=230*1024, SUPABASE_URL='https://iqdrmiokfvugutkyhqgc.supabase.co', SUPABASE_KEY='sb_publishable_LoTw3JqX8Wv9TZ5J4iRXYw_ZeejfMBc';
var app=document.getElementById('app'),adminBtn=document.getElementById('adminBtn'),profBtn=document.getElementById('profBtn');
var state={games:[],me:null,profile:null,view:'home',current:null,isAdmin:false,ready:false,error:'',html:null,signup:false,notice:'',alive:false};
var supabase=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function emailFor(u){return u.toLowerCase()+'@dpsgames.local';}
function say(t,cls){var m=document.getElementById('msg');if(m){m.className='msg '+(cls||'');m.textContent=t;}}
function coverHtml(g){return g.cover?'<img src="'+esc(g.cover)+'" alt="">':esc(g.emoji||'🕹️');}
function setMe(user,profile){state.me=user;state.profile=profile||null;state.isAdmin=!!(profile&&profile.is_admin);state.view='home';adminBtn.hidden=!state.isAdmin;document.getElementById('outBtn').hidden=!user;profBtn.hidden=!user;render();if(user)loadProfile();}
function renderLogin(){
 if(state.signup)return renderSignup();
 app.innerHTML='<div class="panel" style="max-width:380px;margin:40px auto"><h1 style="font-size:24px">Welcome to DPS Games</h1><p class="sub" style="margin-bottom:0">Log in to start playing.</p><label for="lu">Username</label><input type="text" id="lu" autocomplete="username" autocapitalize="none"><label for="lp">Password</label><input type="password" id="lp" autocomplete="current-password" style="width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><div class="row" style="margin-top:16px"><button id="loginBtn">Log in</button><button class="ghost" id="signupBtn">Create account</button></div><div class="msg err" id="lmsg"></div></div>';
 document.getElementById('loginBtn').onclick=doLogin;document.getElementById('signupBtn').onclick=function(){state.signup=true;renderLogin();};document.getElementById('lp').onkeydown=function(e){if(e.key==='Enter')doLogin();};
}
function renderSignup(){var inp='width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)';app.innerHTML='<div class="panel" style="max-width:380px;margin:40px auto"><h1 style="font-size:24px">Create your account</h1><p class="sub" style="margin-bottom:0">Save your scores and game progress.</p><label for="su">Username</label><input type="text" id="su" maxlength="20" autocapitalize="none" autocomplete="username"><label for="sp">Password</label><input type="password" id="sp" style="'+inp+'" autocomplete="new-password"><label for="sp2">Confirm password</label><input type="password" id="sp2" style="'+inp+'" autocomplete="new-password"><div class="row" style="margin-top:16px"><button id="doSignup">Create account</button><button class="ghost" id="toLogin">Back to log in</button></div><div class="msg err" id="smsg"></div></div>';document.getElementById('doSignup').onclick=doSignup;document.getElementById('toLogin').onclick=function(){state.signup=false;renderLogin();};document.getElementById('sp2').onkeydown=function(e){if(e.key==='Enter')doSignup();};}
async function doSignup(){var u=val('su').trim().toLowerCase().replace(/[^a-z0-9_-]/g,''),p=val('sp'),m=document.getElementById('smsg');if(u.length<3){m.textContent='Choose a username with at least 3 letters or numbers.';return;}if(p.length<6){m.textContent='Your password needs at least 6 characters.';return;}if(p!==val('sp2')){m.textContent='The passwords don’t match.';return;}try{var res=await supabase.auth.signUp({email:emailFor(u),password:p,options:{data:{username:u}}});if(res.error)throw res.error;if(!res.data.session){m.textContent='Account created. Ask the site owner to turn off email confirmation in Supabase Auth settings, then log in again.';return;}state.signup=false;await loadMe(res.data.user);}catch(e){m.textContent='Couldn’t create account: '+(e.message||'Please try again.');}}
async function doLogin(){var u=val('lu').trim().toLowerCase(),p=val('lp'),m=document.getElementById('lmsg');if(!u||!p){m.textContent='Enter your username and password.';return;}try{var r=await supabase.auth.signInWithPassword({email:emailFor(u),password:p});if(r.error)throw r.error;await loadMe(r.data.user);}catch(e){m.textContent='Login failed: '+(e.message||'Check your username and password.');}}
async function loadMe(user){var r=await supabase.from('profiles').select('id,username,is_admin').eq('id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){var username=(user.user_metadata&&user.user_metadata.username)||user.email.split('@')[0];var ins=await supabase.from('profiles').upsert({id:user.id,username:username},{onConflict:'id'}).select().single();if(ins.error)throw ins.error;r=ins;}setMe(user,r.data);}
async function logout(){await supabase.auth.signOut();setMe(null,null);state.signup=false;}
function render(){if(!state.me)return renderLogin();if(state.view==='play')return renderPlay();if(state.view==='profile')return renderProfile();if(state.view==='admin'&&state.isAdmin)return renderAdmin();renderHome();}
async function loadProfile(){if(!state.me)return;try{var r=await supabase.from('scores').select('game_id,score,created_at,games(title)').eq('user_id',state.me.id).order('created_at',{ascending:false}).limit(500);if(r.error)throw r.error;var scores={},plays=[];(r.data||[]).forEach(function(x){var title=x.games&&x.games.title||'Game';var s=scores[x.game_id];if(!s){scores[x.game_id]={title:title,best:x.score,last:x.score,at:x.created_at};plays.push({id:x.game_id,title:title,at:new Date(x.created_at).getTime()});}else{if(x.score>s.best)s.best=x.score;}});state.profileData={plays:plays,scores:scores};}catch(e){state.profileData={plays:[],scores:{}};console.warn('Profile data could not load',e);}if(state.view==='profile')renderProfile();}
async function saveProfile(){/* Scores are stored as individual rows in public.scores. */}
function logPlay(g){if(!state.profileData)state.profileData={plays:[],scores:{}};state.profileData.plays.push({id:g.id,title:g.title,at:Date.now()});state.profileData.plays=state.profileData.plays.slice(-50);saveProfile();}
function bestOf(id){var s=state.profileData&&state.profileData.scores[id];return s?s.best:'—';}
async function recordScore(g,n){if(!state.profileData)state.profileData={plays:[],scores:{}};var s=state.profileData.scores[g.id]||{title:g.title,best:n,last:n,at:Date.now()};s.title=g.title;s.last=n;s.at=Date.now();if(n>s.best)s.best=n;state.profileData.scores[g.id]=s;var r=await supabase.from('scores').insert({user_id:state.me.id,game_id:g.id,score:n});if(r.error){console.warn('Could not save score',r.error);var m=document.getElementById('scm');if(m)m.textContent='Could not save score: '+r.error.message;}else{var m=document.getElementById('scm');if(m)m.textContent='Score saved! Best: '+bestOf(g.id);}}
window.addEventListener('message',function(e){var fr=document.getElementById('frame');if(!fr||e.source!==fr.contentWindow||!state.current)return;var d=e.data||{};if(d.type==='dps-alive'){state.alive=true;var tr=document.getElementById('trouble');if(tr)tr.hidden=true;return;}if(d.type==='dps-ready'){sendSave(fr,state.current.id);return;}if(d.type==='dps-save'){putSave(state.current.id,d.data);return;}if(d.type==='score'&&typeof d.score==='number'&&isFinite(d.score)){recordScore(state.current,d.score);var m=document.getElementById('scm');if(m)m.textContent='Score saved! Best: '+bestOf(state.current.id);}});
async function sendSave(fr,id){var r=await supabase.from('game_saves').select('data,updated_at').eq('user_id',state.me.id).eq('game_id',id).maybeSingle();var data=r.data?r.data.data:null;try{var local=JSON.parse(localStorage.getItem('dpsgs:'+id)||'null');if(local&&(!r.data||local.at>Date.parse(r.data.updated_at||'1970-01-01T00:00:00Z')))data=local.data;}catch(e){}if(fr.contentWindow)fr.contentWindow.postMessage({type:'dps-load',data:data},'*');}
async function putSave(id,data){if(typeof data!=='string'||data.length>200000)return;try{localStorage.setItem('dpsgs:'+id,JSON.stringify({data:data,at:Date.now()}));}catch(e){}var r=await supabase.from('game_saves').upsert({user_id:state.me.id,game_id:id,data:data},{onConflict:'user_id,game_id'});if(r.error)console.warn('Game save was only stored on this device',r.error);}
function renderProfile(){var p=state.profileData,h='<div class="row"><button class="ghost" id="back">← All games</button></div><h1 style="margin-top:16px">'+esc(state.profile&&state.profile.username||'Player')+'</h1><p class="sub">'+(state.isAdmin?'Admin':'Player')+'</p>';if(!p){app.innerHTML=h+'<div class="empty">Loading profile…</div>';document.getElementById('back').onclick=goHome;return;}var ids=Object.keys(p.scores);h+='<div class="panel"><h2 style="margin-top:0">Saved scores</h2>'+(ids.length?ids.map(function(i){var s=p.scores[i];return '<div class="item"><span>'+esc(s.title)+'</span><span><b>Best '+esc(s.best)+'</b> · last '+esc(s.last)+'</span></div>';}).join(''):'<div class="hint">No scores saved yet. Play a game and save your score!</div>')+'</div><div class="panel"><h2 style="margin-top:0">History</h2>'+(p.plays.length?p.plays.slice().reverse().slice(0,20).map(function(x){return '<div class="item"><span>'+esc(x.title)+'</span><span class="hint">'+esc(new Date(x.at).toLocaleString())+'</span></div>';}).join(''):'<div class="hint">No games played yet.</div>')+'</div>';app.innerHTML=h;document.getElementById('back').onclick=goHome;}
function renderHome(){var h=(state.notice?'<div class="panel ok">'+esc(state.notice)+'</div>':'')+'<h1>Play now</h1><p class="sub">Pick a game and jump straight in.</p>';if(!state.ready)h+='<div class="empty">Loading games…</div>';else if(state.error)h+='<div class="empty err">'+esc(state.error)+'</div>';else if(!state.games.length)h+='<div class="empty">No games yet.'+(state.isAdmin?' Open the admin panel to upload your first one!':' Check back soon!')+'</div>';else h+='<div class="grid">'+state.games.map(function(g){return '<div class="card" data-id="'+esc(g.id)+'"><div class="cover">'+coverHtml(g)+'</div><div class="body"><h3>'+esc(g.title)+'</h3><p>'+esc(g.description||'')+'</p></div></div>';}).join('')+'</div>';app.innerHTML=h;app.querySelectorAll('.card').forEach(function(el){el.onclick=function(){openGame(el.dataset.id);};});}
async function openGame(id){var g=state.games.find(function(x){return x.id===id;});if(!g)return;state.view='play';state.current=g;state.html=null;state.err='';render();logPlay(g);try{var r=await supabase.from('gamefiles').select('html').eq('game_id',id).maybeSingle();if(r.error)throw r.error;state.html=r.data?r.data.html:'';}catch(e){state.html='';state.err=e.message||'unknown error';}if(state.view==='play'&&state.current&&state.current.id===id)renderPlay();}
function takeover(){if(!state.html)return;var bar='<div style="position:fixed;top:0;left:0;right:0;z-index:99999;padding:8px 12px;background:#6c4cf5"><button id="dpsback" style="font:600 14px system-ui;background:#fff;color:#6c4cf5;border:0;border-radius:8px;padding:6px 12px;cursor:pointer">← Back to DPS Games</button></div><div style="height:44px"></div><script>document.getElementById("dpsback").addEventListener("click",function(){location.reload()})<'+'/script>';var doc=/<body[^>]*>/i.test(state.html)?state.html.replace(/<body[^>]*>/i,function(m){return m+bar;}):bar+state.html;document.open();document.write(doc);document.close();}
function loadFrame(mode){var fr=document.getElementById('frame');if(!fr||!state.html)return;var ping='<script>try{parent.postMessage({type:"dps-alive"},"*")}catch(e){}<'+'/script>';var doc=/<head[^>]*>/i.test(state.html)?state.html.replace(/<head[^>]*>/i,function(m){return m+ping;}):ping+state.html;state.alive=false;var tr=document.getElementById('trouble');if(tr)tr.hidden=true;if(mode==='blob'){try{if(state.blobUrl)URL.revokeObjectURL(state.blobUrl);}catch(e){}state.blobUrl=URL.createObjectURL(new Blob([doc],{type:'text/html'}));fr.removeAttribute('srcdoc');fr.src=state.blobUrl;}else{fr.removeAttribute('src');fr.srcdoc=doc;}clearTimeout(state.tm);state.tm=setTimeout(function(){if(state.alive||state.view!=='play')return;if(mode==='srcdoc')return loadFrame('blob');var t=document.getElementById('trouble');if(t)t.hidden=false;},3500);}
function renderPlay(){var g=state.current,h='<div class="row"><button class="ghost" id="back">← All games</button><button class="ghost" id="fs">Fullscreen</button></div><h1 style="margin-top:16px">'+esc(g.title)+'</h1><p class="sub">'+esc(g.description||'')+'</p>';if(state.html===null)h+='<div class="empty">Loading game…</div>';else if(!state.html)h+='<div class="empty err">This game’s files couldn’t be loaded.'+(state.err?' ('+esc(state.err)+')':'')+'</div>';else h+='<div class="player"><iframe id="frame" sandbox="allow-scripts allow-pointer-lock allow-downloads" allow="fullscreen" title="'+esc(g.title)+'"></iframe></div><div class="row"><input type="text" id="sc" inputmode="numeric" placeholder="Score" style="max-width:140px"><button id="saveSc">Save my score</button><span class="hint" id="scm">Best: '+bestOf(g.id)+'</span></div><div class="hint" id="trouble" hidden style="margin-top:12px">The game didn’t start. <button class="ghost" id="retry">Try again</button> <button class="ghost" id="newtab">Open in a new tab</button> <button class="ghost" id="fullpage">Play full page</button></div>';app.innerHTML=h;document.getElementById('back').onclick=goHome;document.getElementById('fs').onclick=function(){var f=document.getElementById('frame');if(f&&f.requestFullscreen)f.requestFullscreen().catch(function(){});};if(document.getElementById('frame')){loadFrame('srcdoc');var rt=document.getElementById('retry');if(rt)rt.onclick=function(){loadFrame('srcdoc');};var fp=document.getElementById('fullpage');if(fp)fp.onclick=takeover;var nt=document.getElementById('newtab');if(nt)nt.onclick=function(){var u=state.blobUrl||URL.createObjectURL(new Blob([state.html],{type:'text/html'}));window.open(u,'_blank');};}var sb=document.getElementById('saveSc');if(sb)sb.onclick=function(){var raw=val('sc').trim(),n=Number(raw);if(!raw||!isFinite(n))return;recordScore(g,n);document.getElementById('scm').textContent='Saved! Best: '+bestOf(g.id);};}
function renderAdmin(){var h='<h1>Admin panel</h1><p class="sub">Upload a new game or remove an existing one.</p><div class="panel"><h2 style="margin-top:0">Add a game</h2><label for="t">Title</label><input type="text" id="t" maxlength="80"><label for="d">Description</label><input type="text" id="d" maxlength="200"><div class="row"><div><label for="em">Emoji (fallback cover)</label><input type="text" id="em" maxlength="4" value="🕹️" style="width:90px"></div><div><label for="cv">Cover image (optional)</label><input type="file" id="cv" accept="image/*"></div></div><label for="gf">Game file (single .html file)</label><input type="file" id="gf" accept=".html,.htm,text/html"><div class="hint">Or paste the game’s full HTML below. Games must be self-contained (CSS, JS and images inlined) and under 230 KB. For automatic scores, call <code>parent.postMessage({type:&quot;score&quot;,score:123},&quot;*&quot;)</code>.</div><label for="gc">Game HTML</label><textarea id="gc" placeholder="&lt;!DOCTYPE html&gt;…"></textarea><div class="row" style="margin-top:14px"><button id="save">Publish game</button></div><div class="msg" id="msg"></div></div><div class="panel"><h2 style="margin-top:0">Your games ('+state.games.length+')</h2>'+(state.games.length?state.games.map(function(g){return '<div class="item"><span>'+esc(g.emoji||'🕹️')+' '+esc(g.title)+'</span><button class="danger" data-del="'+esc(g.id)+'">Delete</button></div>';}).join(''):'<div class="hint">Nothing uploaded yet.</div>')+'</div>';app.innerHTML=h;document.getElementById('gf').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){document.getElementById('gc').value=r.result;var t=document.getElementById('t');if(!t.value)t.value=f.name.replace(/\.[^.]+$/,'');};r.readAsText(f);};document.getElementById('save').onclick=saveGame;app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){delGame(b.dataset.del);};});}
async function saveGame(){var title=val('t').trim(),html=val('gc');if(!title)return say('Please add a title.','err');if(!html.trim())return say('Please add a game file or paste its HTML.','err');if(new Blob([html]).size>MAX)return say('That game is over 230 KB. Try minifying it or inlining fewer assets.','err');var btn=document.getElementById('save');btn.disabled=true;say('Publishing…');try{var emoji=val('em').trim()||'🕹️',cover='';var cf=document.getElementById('cv').files[0];if(cf){if(cf.size>700000){throw new Error('Cover image must be smaller than 700 KB.');}cover=await new Promise(function(resolve,reject){var rd=new FileReader();rd.onload=function(){resolve(rd.result);};rd.onerror=reject;rd.readAsDataURL(cf);});}var id='g'+Date.now().toString(36);var gr=await supabase.from('games').insert({id:id,title:title,description:val('d').trim(),emoji:emoji,cover:cover});if(gr.error)throw gr.error;var fr=await supabase.from('gamefiles').insert({game_id:id,html:html});if(fr.error){await supabase.from('games').delete().eq('id',id);throw fr.error;}say('Published! It’s live on the home page.','ok');await refreshGames();renderAdmin();say('Published! It’s live on the home page.','ok');}catch(e){say('Couldn’t publish: '+(e.message||'unknown error'),'err');btn.disabled=false;}}
async function delGame(id){if(!confirm('Delete this game for good?'))return;try{var a=await supabase.from('gamefiles').delete().eq('game_id',id);if(a.error)throw a.error;var b=await supabase.from('games').delete().eq('id',id);if(b.error)throw b.error;await refreshGames();renderAdmin();}catch(e){alert('Couldn’t delete: '+(e.message||'error'));}}
async function refreshGames(){var r=await supabase.from('games').select('id,title,description,emoji,cover,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;state.games=(r.data||[]).map(function(g){return Object.assign({emoji:'🕹️',cover:''},g);});state.ready=true;state.error='';}
function goHome(){state.view='home';state.current=null;render();}
document.getElementById('logo').onclick=goHome;adminBtn.onclick=function(){state.view=state.view==='admin'?'home':'admin';render();};document.getElementById('outBtn').onclick=logout;profBtn.onclick=function(){state.view='profile';render();};
render();
(async function init(){try{if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase library did not load. Check your internet connection.');supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});var session=await supabase.auth.getSession();if(session.error)throw session.error;if(session.data.session)await loadMe(session.data.session.user);await refreshGames();if(state.me)render();else renderLogin();}catch(e){state.ready=true;state.error='Couldn’t connect to DPS Games: '+(e.message||'unknown error');render();}supabase&&supabase.auth.onAuthStateChange(function(event,session){if(event==='SIGNED_OUT'){state.me=null;state.profile=null;state.profileData=null;render();}});})();
})();
</script>
