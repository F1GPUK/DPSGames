<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPS Games</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--text:#1d1b2e;--muted:#6b6880;--accent:#6c4cf5;--accent2:#ff5c8a;--line:#e4e1f0;--danger:#d93a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111f;--card:#1e1b30;--text:#f1eefc;--muted:#9a96b5;--line:#322e4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13111f;--card:#1e1b30;--text:#f1eefc;--muted:#9a96b5;--line:#322e4d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
nav{display:flex;gap:8px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger)}
button:disabled{opacity:.5;cursor:default}
main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.cover{aspect-ratio:16/10;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.card .body{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.player{background:#000;border-radius:14px;overflow:hidden;margin:16px 0}
.player iframe{width:100%;height:min(70vh,640px);border:0;display:block;background:#000}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.msg{margin-top:12px;font-size:14px}.err{color:var(--danger)}.ok{color:#1f9d55}
.request-item{align-items:flex-start}.request-details{padding:4px 0 2px}.request-details[hidden]{display:none}.scroll{overflow-x:auto}
</style>
</head>
<body>

  <div class="logo" id="logo">🎮 DPS Games</div>
  <nav><button class="ghost" id="accountBtn">Sign in</button><button class="ghost" id="adminBtn" hidden>Admin panel</button><button class="ghost" id="scoresBtn">Leaderboard</button><button class="ghost" id="profBtn" hidden>My profile</button><button class="ghost" id="outBtn" hidden>Log out</button></nav>
</header>
<main id="app"></main>

var MAX=230*1024, SUPABASE_URL='https://iqdrmiokfvugutkyhqgc.supabase.co', SUPABASE_KEY='sb_publishable_LoTw3JqX8Wv9TZ5J4iRXYw_ZeejfMBc';

function renderSignup(){var inp='width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)';app.innerHTML='<div class="panel" style="max-width:380px;margin:40px auto"><h1 style="font-size:24px">Create your account</h1><p class="sub" style="margin-bottom:0">Save your scores and game progress.</p><label for="su">Username</label><input type="text" id="su" maxlength="20" autocapitalize="none" autocomplete="username"><label for="sp">Password</label><input type="password" id="sp" style="'+inp+'" autocomplete="new-password"><label for="sp2">Confirm password</label><input type="password" id="sp2" style="'+inp+'" autocomplete="new-password"><div class="row" style="margin-top:16px"><button id="doSignup">Create account</button><button class="ghost" id="toLogin">Back to log in</button></div><div class="msg err" id="smsg"></div></div>';document.getElementById('doSignup').onclick=doSignup;document.getElementById('toLogin').onclick=function(){state.signup=false;renderLogin();};document.getElementById('sp2').onkeydown=function(e){if(e.key==='Enter')doSignup();};}
async function doSignup(){var u=val('su').trim().toLowerCase().replace(/[^a-z0-9_-]/g,''),p=val('sp'),m=document.getElementById('smsg');if(u.length<3){m.textContent='Choose a username with at least 3 letters or numbers.';return;}if(p.length<6){m.textContent='Your password needs at least 6 characters.';return;}if(p!==val('sp2')){m.textContent='The passwords don’t match.';return;}try{var res=await supabase.auth.signUp({email:emailFor(u),password:p,options:{data:{username:u}}});if(res.error)throw res.error;if(!res.data.session){m.textContent='Account created. Ask the site owner to turn off email confirmation in Supabase Auth settings, then log in again.';return;}state.signup=false;await loadMe(res.data.user);}catch(e){m.textContent='Couldn’t create account: '+(e.message||'Please try again.');}}

window.addEventListener('message',function(e){var fr=document.getElementById('frame');if(!fr||e.source!==fr.contentWindow||!state.current)return;var d=e.data||{};if(d.type==='dps-alive'){state.alive=true;var tr=document.getElementById('trouble');if(tr)tr.hidden=true;return;}if(d.type==='dps-ready'){sendSave(fr,state.current.id);return;}if(d.type==='dps-save'){putSave(state.current.id,d.data);return;}if(d.type==='score'&&typeof d.score==='number'&&isFinite(d.score)){recordScore(state.current,d.score);var m=document.getElementById('scm');if(m)m.textContent='Score saved! Best: '+bestOf(state.current.id);}});
async function sendSave(fr,id){if(!state.me){if(fr.contentWindow)fr.contentWindow.postMessage({type:'dps-load',data:null},'*');return;}var r=await supabase.from('game_saves').select('data,updated_at').eq('user_id',state.me.id).eq('game_id',id).maybeSingle();var data=r.data?r.data.data:null;try{var local=JSON.parse(localStorage.getItem('dpsgs:'+id)||'null');if(local&&(!r.data||local.at>Date.parse(r.data.updated_at||'1970-01-01T00:00:00Z')))data=local.data;}catch(e){}if(fr.contentWindow)fr.contentWindow.postMessage({type:'dps-load',data:data},'*');}

async function renderLeaderboard(){app.innerHTML='<div class="row"><button class="ghost" id="back">← All games</button></div><h1 style="margin-top:16px">Leaderboard</h1><p class="sub">Top scores across DPS Games.</p><div class="panel"><div class="hint">Loading scores…</div></div>';document.getElementById('back').onclick=goHome;try{var r=await supabase.from('scores').select('user_id,game_id,score,created_at').order('score',{ascending:false}).limit(1000);if(r.error)throw r.error;var rows=r.data||[],ids=Array.from(new Set(rows.map(function(x){return x.user_id;}))),gids=Array.from(new Set(rows.map(function(x){return x.game_id;}))),users={},games={};if(ids.length){var ur=await supabase.from('profiles').select('id,username').in('id',ids);if(ur.error)throw ur.error;(ur.data||[]).forEach(function(x){users[x.id]=x.username;});}if(gids.length){var gr=await supabase.from('games').select('id,title,category').in('id',gids);if(gr.error)throw gr.error;(gr.data||[]).forEach(function(x){games[x.id]=x;});}var best={};rows.forEach(function(x){var key=x.user_id+'|'+x.game_id;if(!best[key]||Number(x.score)>Number(best[key].score))best[key]=x;});var list=Object.keys(best).map(function(k){return best[k];}).sort(function(a,b){return Number(b.score)-Number(a.score);}).slice(0,50);var html='<div class="scroll"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th style="padding:10px">#</th><th>Player</th><th>Game</th><th>Category</th><th style="text-align:right">Score</th></tr></thead><tbody>';html+=list.map(function(x,i){var g=games[x.game_id]||{};return '<tr style="border-top:1px solid var(--line)"><td style="padding:10px">'+(i+1)+'</td><td>'+esc(users[x.user_id]||'Player')+'</td><td>'+esc(g.title||'Game')+'</td><td>'+esc(g.category||'—')+'</td><td style="text-align:right"><b>'+esc(x.score)+'</b></td></tr>';}).join('');html+='</tbody></table></div>';if(!list.length)html='<div class="hint">No scores have been submitted yet.</div>';app.innerHTML='<div class="row"><button class="ghost" id="back">← All games</button></div><h1 style="margin-top:16px">Leaderboard</h1><p class="sub">Best score per player, per game.</p><div class="panel">'+html+'</div>';document.getElementById('back').onclick=goHome;}catch(e){app.innerHTML='<div class="row"><button class="ghost" id="back">← All games</button></div><h1 style="margin-top:16px">Leaderboard</h1><div class="panel err">Could not load the leaderboard: '+esc(e.message||'unknown error')+'. Check the Supabase setup instructions.</div>';document.getElementById('back').onclick=goHome;}}
function renderProfile(){var p=state.profileData,h='<div class="row"><button class="ghost" id="back">← All games</button></div><h1 style="margin-top:16px">'+esc(state.profile&&state.profile.username||'Player')+'</h1><p class="sub">'+(state.isAdmin?'Admin':'Player')+'</p>';if(!p){app.innerHTML=h+'<div class="empty">Loading profile…</div>';document.getElementById('back').onclick=goHome;return;}var ids=Object.keys(p.scores);h+='<div class="panel"><h2 style="margin-top:0">Saved scores</h2>'+(ids.length?ids.map(function(i){var s=p.scores[i];return '<div class="item"><span>'+esc(s.title)+'</span><span><b>Best '+esc(s.best)+'</b> · last '+esc(s.last)+'</span></div>';}).join(''):'<div class="hint">No scores saved yet. Play a game and save your score!</div>')+'</div><div class="panel"><h2 style="margin-top:0">History</h2>'+(p.plays.length?p.plays.slice().reverse().slice(0,20).map(function(x){return '<div class="item"><span>'+esc(x.title)+'</span><span class="hint">'+esc(new Date(x.at).toLocaleString())+'</span></div>';}).join(''):'<div class="hint">No games played yet.</div>')+'</div>';app.innerHTML=h;document.getElementById('back').onclick=goHome;}
function renderHome(){var cats=['All'].concat(Array.from(new Set(state.games.map(function(g){return String(g.category||'').trim();}).filter(Boolean))).sort());var shown=state.categoryFilter==='All'?state.games:state.games.filter(function(g){return String(g.category||'').trim()===state.categoryFilter;});var h=(state.notice?'<div class="panel ok">'+esc(state.notice)+'</div>':'')+'<div class="panel"><h2 style="margin-top:0">Request a game</h2><p class="sub">Tell us what game you would like to see on DPS Games and what you want it to include.</p><label for="requestGameName">Game name</label><input id="requestGameName" type="text" maxlength="80" placeholder="What should the game be called?"><label for="requestGameIdeas">What would you want in it?</label><textarea id="requestGameIdeas" maxlength="1500" rows="7" style="min-height:190px" placeholder="Describe the gameplay, features, modes, characters, etc."></textarea><div class="row" style="margin-top:10px"><button id="submitGameRequest">Send game request</button><span class="hint" id="gameRequestMsg"></span></div></div><h1>Play now</h1><p class="sub">Pick a game and jump straight in.</p>';if(state.ready&&cats.length>1)h+='<div class="row" style="margin-bottom:18px"><label for="categoryFilter" style="margin:0">Category</label><select id="categoryFilter" style="font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)">'+cats.map(function(c){return '<option'+(c===state.categoryFilter?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div>';if(!state.ready)h+='<div class="empty">Loading games…</div>';else if(state.error)h+='<div class="empty err">'+esc(state.error)+'</div>';else if(!state.games.length)h+='<div class="empty">No games yet.'+(state.isAdmin?' Open the admin panel to upload your first one!':' Check back soon!')+'</div>';else if(!shown.length)h+='<div class="empty">No games in this category yet.</div>';else h+='<div class="grid">'+shown.map(function(g){return '<div class="card" data-id="'+esc(g.id)+'"><div class="cover">'+coverHtml(g)+'</div><div class="body"><h3>'+esc(g.title)+'</h3><p>'+(g.category?'<b>'+esc(g.category)+'</b> · ':'')+esc(g.description||'')+'</p></div></div>';}).join('')+'</div>';app.innerHTML=h;var requestBtn=document.getElementById('submitGameRequest');if(requestBtn)requestBtn.onclick=submitGameRequest;var cf=document.getElementById('categoryFilter');if(cf)cf.onchange=function(){state.categoryFilter=cf.value;renderHome();};app.querySelectorAll('.card').forEach(function(el){el.onclick=function(){openGame(el.dataset.id);};});if(state.ready&&!state.me&&!sessionStorage.getItem('dpsSigninPromptSeen')){sessionStorage.setItem('dpsSigninPromptSeen','1');var overlay=document.createElement('div');overlay.id='signinPrompt';overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999';overlay.innerHTML='<div class="panel" style="max-width:420px;width:100%;margin:0;text-align:center"><h2>Save your progress?</h2><p class="sub">You can play any game without an account. Sign in or create an account to save scores and game progress.</p><div class="row" style="justify-content:center"><button id="promptSignIn">Sign in / Create account</button><button class="ghost" id="promptContinue">Continue playing</button></div></div>';document.body.appendChild(overlay);document.getElementById('promptContinue').onclick=function(){overlay.remove();};document.getElementById('promptSignIn').onclick=function(){overlay.remove();state.signup=false;renderLogin();};}}
async function submitGameRequest(){var name=document.getElementById('requestGameName'),ideas=document.getElementById('requestGameIdeas'),msg=document.getElementById('gameRequestMsg'),btn=document.getElementById('submitGameRequest');var gameName=(name.value||'').trim(),details=(ideas.value||'').trim();if(!gameName||!details){msg.textContent='Please fill in both boxes.';return;}btn.disabled=true;msg.textContent='Sending…';try{var r=await supabase.from('game_requests').insert({game_name:gameName,details:details});if(r.error)throw r.error;name.value='';ideas.value='';msg.textContent='Thanks! Your request has been sent to the admins.';}catch(e){msg.textContent='Could not send request: '+(e.message||'unknown error');}finally{btn.disabled=false;}}

function takeover(){if(!state.html)return;var bar='<div style="position:fixed;top:0;left:0;right:0;z-index:99999;padding:8px 12px;background:#6c4cf5"><button id="dpsback" style="font:600 14px system-ui;background:#fff;color:#6c4cf5;border:0;border-radius:8px;padding:6px 12px;cursor:pointer">← Back to DPS Games</button></div><div style="height:44px"></div><script>document.getElementById("dpsback").addEventListener("click",function(){location.reload()})<'+'/script>';var doc=/<body[^>]*>/i.test(state.html)?state.html.replace(/<body[^>]*>/i,function(m){return m+bar;}):bar+state.html;document.open();document.write(doc);document.close();}
function loadFrame(mode){var fr=document.getElementById('frame');if(!fr||!state.html)return;var ping='<script>try{parent.postMessage({type:"dps-alive"},"*")}catch(e){}<'+'/script>';var doc=/<head[^>]*>/i.test(state.html)?state.html.replace(/<head[^>]*>/i,function(m){return m+ping;}):ping+state.html;state.alive=false;var tr=document.getElementById('trouble');if(tr)tr.hidden=true;if(mode==='blob'){try{if(state.blobUrl)URL.revokeObjectURL(state.blobUrl);}catch(e){}state.blobUrl=URL.createObjectURL(new Blob([doc],{type:'text/html'}));fr.removeAttribute('srcdoc');fr.src=state.blobUrl;}else{fr.removeAttribute('src');fr.srcdoc=doc;}clearTimeout(state.tm);state.tm=setTimeout(function(){if(state.alive||state.view!=='play')return;if(mode==='srcdoc')return loadFrame('blob');var t=document.getElementById('trouble');if(t)t.hidden=false;},3500);}
function renderPlay(){var g=state.current,h='<div class="row"><button class="ghost" id="back">← All games</button><button class="ghost" id="fs">Fullscreen</button></div><h1 style="margin-top:16px">'+esc(g.title)+'</h1><p class="sub">'+esc(g.description||'')+'</p>';if(state.html===null)h+='<div class="empty">Loading game…</div>';else if(!state.html)h+='<div class="empty err">This game’s files couldn’t be loaded.'+(state.err?' ('+esc(state.err)+')':'')+'</div>';else h+='<div class="player"><iframe id="frame" sandbox="allow-scripts allow-pointer-lock allow-downloads" allow="fullscreen" title="'+esc(g.title)+'"></iframe></div><div class="row"><input type="text" id="sc" inputmode="numeric" placeholder="Score" style="max-width:140px"><button id="saveSc">Save my score</button><span class="hint" id="scm">Best: '+bestOf(g.id)+'</span></div><div class="hint" id="trouble" hidden style="margin-top:12px">The game didn’t start. <button class="ghost" id="retry">Try again</button> <button class="ghost" id="newtab">Open in a new tab</button> <button class="ghost" id="fullpage">Play full page</button></div>';app.innerHTML=h;document.getElementById('back').onclick=goHome;document.getElementById('fs').onclick=function(){var f=document.getElementById('frame');if(f&&f.requestFullscreen)f.requestFullscreen().catch(function(){});};if(document.getElementById('frame')){loadFrame('srcdoc');var rt=document.getElementById('retry');if(rt)rt.onclick=function(){loadFrame('srcdoc');};var fp=document.getElementById('fullpage');if(fp)fp.onclick=takeover;var nt=document.getElementById('newtab');if(nt)nt.onclick=function(){var u=state.blobUrl||URL.createObjectURL(new Blob([state.html],{type:'text/html'}));window.open(u,'_blank');};}var sb=document.getElementById('saveSc');if(sb)sb.onclick=function(){var raw=val('sc').trim(),n=Number(raw);if(!raw||!isFinite(n))return;recordScore(g,n);document.getElementById('scm').textContent='Saved! Best: '+bestOf(g.id);};}
function renderAdmin(){var h='<h1>Admin panel</h1><p class="sub">Manage categories, game requests and games.</p><div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Game requests</h2><button class="ghost" id="refreshRequestsBtn">Refresh</button></div><p class="hint">Suggestions submitted by players on the home page.</p><div id="gameRequestsList"><div class="hint">Loading requests…</div></div><div class="msg" id="requestsMsg"></div></div><div class="panel"><h2 style="margin-top:0">Game categories</h2><p class="hint">Create categories here, then assign games to them below.</p><div class="row"><input type="text" id="newCategory" maxlength="40" placeholder="New category name" style="max-width:300px"><button id="addCategoryBtn">＋ Add category</button></div><div id="categoryList" class="hint" style="margin-top:12px">Loading categories…</div><div class="msg" id="categoryMsg"></div></div><div class="panel"><h2 style="margin-top:0">Add a game</h2><label for="t">Title</label><input type="text" id="t" maxlength="80"><label for="d">Description</label><input type="text" id="d" maxlength="200"><label for="cat">Category</label><select id="cat" style="width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><option value="">Uncategorised</option></select><div class="row"><div><label for="em">Emoji (fallback cover)</label><input type="text" id="em" maxlength="4" value="🕹️" style="width:90px"></div><div><label for="cv">Cover image (optional)</label><input type="file" id="cv" accept="image/*"></div></div><label for="gf">Game file (single .html file)</label><input type="file" id="gf" accept=".html,.htm,text/html"><div class="hint">Or paste the game’s full HTML below. Games must be self-contained (CSS, JS and images inlined) and under 230 KB. For automatic scores, call <code>parent.postMessage({type:&quot;score&quot;,score:123},&quot;*&quot;)</code>.</div><label for="gc">Game HTML</label><textarea id="gc" placeholder="&lt;!DOCTYPE html&gt;…"></textarea><div class="row" style="margin-top:14px"><button id="save">Publish game</button></div><div class="msg" id="msg"></div></div><div class="panel"><h2 style="margin-top:0">Your games ('+state.games.length+')</h2>'+(state.games.length?state.games.map(function(g){return '<div class="item"><span>'+esc(g.emoji||'🕹️')+' '+esc(g.title)+'</span><div class="row"><button class="ghost" data-edit="'+esc(g.id)+'">Edit name/logo</button><button class="ghost" data-set-category="'+esc(g.id)+'">Set category</button><button class="ghost" data-upload-photo="'+esc(g.id)+'">Upload photo</button><button class="ghost" data-download="'+esc(g.id)+'">Download HTML</button><button class="danger" data-del="'+esc(g.id)+'">Delete</button></div></div>';}).join(''):'<div class="hint">Nothing uploaded yet.</div>')+'</div>'+(state.isAdmin&&((state.profile&&String(state.profile.username||'').toLowerCase()==='isaac')||(state.me&&String(state.me.email||'').toLowerCase()==='isaac@dpsgames.local'))?'<div class="panel"><h2 style="margin-top:0">Admin management</h2><p class="hint">Only Isaac can add new administrators.</p><button id="addAdminBtn">＋ Add admin</button><div class="msg" id="adminMsg"></div></div><div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">User management</h2><button class="ghost" id="refreshUsersBtn">Refresh list</button></div><p class="hint">Only the owner account (isaac) can see and use these controls. Set passwords or delete player accounts.</p><div id="userList"><div class="hint">Loading registered users…</div></div><div class="msg" id="userManageMsg"></div></div>':'');app.innerHTML=h;var notesPanel=document.createElement('div');notesPanel.className='panel';notesPanel.innerHTML='<h2 style="margin-top:0">Admin shared notepad</h2><p class="hint">Shared notes for all admins.</p><textarea id="adminNotes" rows="12" style="min-height:320px;height:320px" placeholder="Write admin notes here…"></textarea><div class="row" style="margin-top:10px"><button id="saveAdminNotes">Save notes</button><span class="hint" id="notesStatus"></span></div>';app.insertBefore(notesPanel,app.firstChild);loadAdminNotes();loadCategoriesAdmin();loadGameRequests();var refreshRequestsBtn=document.getElementById('refreshRequestsBtn');if(refreshRequestsBtn)refreshRequestsBtn.onclick=loadGameRequests;var addCategoryBtn=document.getElementById('addCategoryBtn');if(addCategoryBtn)addCategoryBtn.onclick=createCategory;var addAdminBtn=document.getElementById('addAdminBtn');if(addAdminBtn)addAdminBtn.onclick=addAdmin;var refreshUsersBtn=document.getElementById('refreshUsersBtn');if(refreshUsersBtn)refreshUsersBtn.onclick=loadUsers;loadUsers();document.getElementById('gf').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){document.getElementById('gc').value=r.result;var t=document.getElementById('t');if(!t.value)t.value=f.name.replace(/\.[^.]+$/,'');};r.readAsText(f);};populateGameCategorySelect();document.getElementById('save').onclick=saveGame;app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){delGame(b.dataset.del);};});app.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){editGameDetails(b.dataset.edit);};});app.querySelectorAll('[data-set-category]').forEach(function(b){b.onclick=function(){setExistingGameCategory(b.dataset.setCategory);};});app.querySelectorAll('[data-upload-photo]').forEach(function(b){b.onclick=function(){uploadGamePhoto(b.dataset.uploadPhoto);};});app.querySelectorAll('[data-download]').forEach(function(b){b.onclick=function(){downloadGameHtml(b.dataset.download);};});}
async function loadGameRequests(){var box=document.getElementById('gameRequestsList');if(!box)return;box.innerHTML='<div class="hint">Loading requests…</div>';try{var r=await supabase.from('game_requests').select('id,game_name,details,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;if(!r.data||!r.data.length){box.innerHTML='<div class="hint">No game requests yet.</div>';return;}box.innerHTML=r.data.map(function(x){return '<div class="item request-item"><div style="min-width:0;flex:1"><b>'+esc(x.game_name)+'</b><div class="request-details" id="request-details-'+esc(x.id)+'" hidden><p style="white-space:pre-wrap;margin:8px 0">'+esc(x.details)+'</p><span class="hint">Submitted: '+esc(new Date(x.created_at).toLocaleString())+'</span></div></div><div class="row"><button class="ghost" data-read-request="'+esc(x.id)+'">Read</button><button class="danger" data-delete-request="'+esc(x.id)+'">Delete</button></div></div>';}).join('');box.querySelectorAll('[data-read-request]').forEach(function(b){b.onclick=function(){var details=document.getElementById('request-details-'+b.getAttribute('data-read-request'));var opening=details.hidden;details.hidden=!opening;b.textContent=opening?'Hide':'Read';};});box.querySelectorAll('[data-delete-request]').forEach(function(b){b.onclick=async function(){if(!confirm('Delete this game request?'))return;try{var d=await supabase.from('game_requests').delete().eq('id',b.getAttribute('data-delete-request'));if(d.error)throw d.error;loadGameRequests();}catch(e){var m=document.getElementById('requestsMsg');if(m)m.textContent='Could not delete request: '+(e.message||'unknown error');}};});}catch(e){box.innerHTML='<div class="err">Could not load requests: '+esc(e.message||'unknown error')+'. Check the game_requests table setup.</div>';}}
async function loadCategoriesAdmin(){var box=document.getElementById('categoryList');if(!box)return;try{var r=await supabase.from('game_categories').select('name').order('name');if(r.error)throw r.error;state.categories=(r.data||[]).map(function(x){return x.name;});renderCategoryAdminList();populateGameCategorySelect();}catch(e){state.categories=Array.from(new Set(state.games.map(function(g){return g.category||'';}).filter(Boolean))).sort();box.innerHTML='<span class="err">Categories table needs setting up in Supabase. Run the SQL instructions provided below.</span>';populateGameCategorySelect();}}
function renderCategoryAdminList(){var box=document.getElementById('categoryList');if(!box)return;if(!state.categories.length){box.innerHTML='<span class="hint">No categories yet. Add one above.</span>';return;}box.innerHTML=state.categories.map(function(c){return '<div class="item"><b>'+esc(c)+'</b><button class="danger" data-remove-category="'+esc(c)+'">Delete</button></div>';}).join('');box.querySelectorAll('[data-remove-category]').forEach(function(b){b.onclick=function(){deleteCategory(b.getAttribute('data-remove-category'));};});}
function populateGameCategorySelect(){var sel=document.getElementById('cat');if(!sel)return;var chosen=sel.value;sel.innerHTML='<option value="">Uncategorised</option>'+state.categories.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');if(chosen&&state.categories.indexOf(chosen)>=0)sel.value=chosen;}
async function createCategory(){var input=document.getElementById('newCategory'),msg=document.getElementById('categoryMsg'),name=(input.value||'').trim();if(!name){msg.textContent='Enter a category name.';return;}if(name.length>40){msg.textContent='Category names must be 40 characters or fewer.';return;}if(state.categories.some(function(c){return c.toLowerCase()===name.toLowerCase();})){msg.textContent='That category already exists.';return;}try{var r=await supabase.from('game_categories').insert({name:name});if(r.error)throw r.error;state.categories.push(name);state.categories.sort();input.value='';msg.textContent='Category created.';renderCategoryAdminList();populateGameCategorySelect();}catch(e){msg.textContent='Could not create category: '+(e.message||'unknown error');}}
async function deleteCategory(name){if(!confirm('Delete the category "'+name+'"? Games in it will become uncategorised.'))return;var msg=document.getElementById('categoryMsg');try{var a=await supabase.from('games').update({category:''}).eq('category',name);if(a.error)throw a.error;var r=await supabase.from('game_categories').delete().eq('name',name);if(r.error)throw r.error;state.categories=state.categories.filter(function(c){return c!==name;});await refreshGames();renderAdmin();}catch(e){if(msg)msg.textContent='Could not delete category: '+(e.message||'unknown error');}}
async function downloadGameHtml(id){try{var r=await supabase.from('gamefiles').select('html').eq('game_id',id).single();if(r.error)throw r.error;var g=state.games.find(function(x){return x.id===id;});var blob=new Blob([r.data.html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(g&&g.title?g.title:'game').replace(/[^a-z0-9_-]+/gi,'_')+'.html';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);}catch(e){alert('Download failed: '+(e.message||'unknown error'));}}
async function loadAdminNotes(){var box=document.getElementById('adminNotes'),status=document.getElementById('notesStatus');if(!box)return;try{var r=await supabase.from('admin_notes').select('notes').eq('id',1).maybeSingle();if(r.error)throw r.error;box.value=r.data?r.data.notes||'':'';}catch(e){if(status)status.textContent='Set up the admin_notes table in Supabase first.';}var b=document.getElementById('saveAdminNotes');if(b)b.onclick=saveAdminNotes;}
async function saveAdminNotes(){var box=document.getElementById('adminNotes'),status=document.getElementById('notesStatus'),b=document.getElementById('saveAdminNotes');if(!box)return;if(b)b.disabled=true;if(status)status.textContent='Saving…';try{var r=await supabase.from('admin_notes').upsert({id:1,notes:box.value,updated_at:new Date().toISOString()},{onConflict:'id'});if(r.error)throw r.error;if(status)status.textContent='Saved.';}catch(e){if(status)status.textContent='Save failed: '+(e.message||'error');}finally{if(b)b.disabled=false;}}
async function addAdmin(){var username=window.prompt('Enter the exact username of the player you want to make an admin:');if(username===null)return;username=username.trim().toLowerCase();var msg=document.getElementById('adminMsg');if(!/^[a-z0-9_-]{3,20}$/.test(username)){if(msg){msg.className='msg err';msg.textContent='Enter a valid username (3–20 letters, numbers, _ or -).';}return;}var btn=document.getElementById('addAdminBtn');if(btn)btn.disabled=true;if(msg){msg.className='msg';msg.textContent='Adding '+username+'…';}try{var r=await supabase.rpc('add_dps_admin',{target_username:username});if(r.error)throw r.error;if(msg){msg.className='msg ok';msg.textContent='Done! '+String(r.data||username)+' is now an admin.';}}catch(e){if(msg){msg.className='msg err';msg.textContent='Could not add admin: '+(e.message||'unknown error')+'. Check that the admin SQL setup has been run.';}}finally{if(btn)btn.disabled=false;}}
async function callUserAdmin(body){var r=await supabase.functions.invoke('admin-users',{body:body});if(r.error)throw new Error(r.error.message||'Could not contact the account management function.');if(r.data&&r.data.error)throw new Error(r.data.error);return r.data||{};}
async function loadUsers(){var list=document.getElementById('userList'),msg=document.getElementById('userManageMsg'),refresh=document.getElementById('refreshUsersBtn');if(!list)return;if(refresh)refresh.disabled=true;list.innerHTML='<div class="hint">Loading registered users…</div>';if(msg)msg.textContent='';try{var data=await callUserAdmin({action:'list'}),users=data.users||[];if(!users.length){list.innerHTML='<div class="hint">No registered users found.</div>';return;}list.innerHTML=users.map(function(u){var owner=String(u.username||'').toLowerCase()==='isaac';return '<div class="item"><div style="min-width:0"><b>'+esc(u.username||'Unknown')+'</b>'+(u.is_admin?' <span class="hint">· Admin</span>':'')+(owner?' <span class="hint">· Owner</span>':'')+'</div><div class="row">'+(owner?'<span class="hint">Protected</span>':'<button class="ghost" data-set-password="'+esc(u.username)+'">Set password</button><button class="danger" data-delete-user="'+esc(u.username)+'">Delete</button>')+'</div></div>';}).join('');list.querySelectorAll('[data-set-password]').forEach(function(b){b.onclick=function(){setUserPassword(b.getAttribute('data-set-password'));};});list.querySelectorAll('[data-delete-user]').forEach(function(b){b.onclick=function(){deleteUser(b.getAttribute('data-delete-user'));};});}catch(e){list.innerHTML='<div class="hint err">Could not load users: '+esc(e.message||'unknown error')+'. Make sure the admin-users function has been deployed in Supabase.</div>';}finally{if(refresh)refresh.disabled=false;}}
async function setUserPassword(username){var password=window.prompt('Enter a new password for '+username+' (at least 8 characters):');if(password===null)return;if(password.length<8||password.length>72){alert('Password must be between 8 and 72 characters.');return;}if(!window.confirm('Set this new password for '+username+'?'))return;var msg=document.getElementById('userManageMsg');try{if(msg){msg.className='msg';msg.textContent='Updating password…';}await callUserAdmin({action:'set_password',username:username,password:password});if(msg){msg.className='msg ok';msg.textContent='Password updated for '+username+'. Give the new password to the player privately.';}}catch(e){if(msg){msg.className='msg err';msg.textContent='Could not set password: '+(e.message||'unknown error');}}}
async function deleteUser(username){if(!username)return;if(!window.confirm('Permanently delete the account "'+username+'" and all of its scores and saved game progress? This cannot be undone.'))return;var msg=document.getElementById('userManageMsg');try{if(msg){msg.className='msg';msg.textContent='Deleting '+username+'…';}await callUserAdmin({action:'delete',username:username});if(msg){msg.className='msg ok';msg.textContent='Deleted account: '+username+'.';}await loadUsers();}catch(e){if(msg){msg.className='msg err';msg.textContent='Could not delete user: '+(e.message||'unknown error')+'.';}}}
async function uploadGamePhoto(id){var g=state.games.find(function(x){return x.id===id;});if(!g)return;var input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async function(){var file=input.files&&input.files[0];if(!file)return;if(file.size>700000){alert('Photo must be smaller than 700 KB.');return;}try{var cover=await new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(reader.result);};reader.onerror=reject;reader.readAsDataURL(file);});var r=await supabase.from('games').update({cover:cover}).eq('id',id);if(r.error)throw r.error;await refreshGames();renderAdmin();}catch(e){alert('Could not upload photo: '+(e.message||'unknown error'));}};input.click();}
async function setExistingGameCategory(id){var g=state.games.find(function(x){return x.id===id;});if(!g)return;var choices=['(Uncategorised)'].concat(state.categories);var current=g.category||'(Uncategorised)';var picked=window.prompt('Choose a category by typing its name:\n'+choices.join('\n'),current);if(picked===null)return;picked=picked.trim();if(picked==='(Uncategorised)')picked='';else if(state.categories.indexOf(picked)<0){alert('Please enter one of the listed category names exactly.');return;}try{var r=await supabase.from('games').update({category:picked}).eq('id',id);if(r.error)throw r.error;await refreshGames();renderAdmin();}catch(e){alert('Could not set category: '+(e.message||'unknown error'));}}
async function editGameDetails(id){var g=state.games.find(function(x){return x.id===id;});if(!g)return;var title=window.prompt('Game name:',g.title);if(title===null)return;title=title.trim();if(!title){alert('Game name cannot be empty.');return;}var description=window.prompt('Game description:',g.description||'');if(description===null)return;var emoji=window.prompt('Logo emoji (used if there is no image):',g.emoji||'🕹️');if(emoji===null)return;var category=window.prompt('Category (e.g. Racing, Puzzle, Action):',g.category||'');if(category===null)return;var cover=window.prompt('Logo image URL (leave blank to keep current image):',g.cover||'');if(cover===null)return;if(!cover.trim())cover=g.cover||'';try{var r=await supabase.from('games').update({title:title,description:description.trim(),emoji:emoji.trim()||'🕹️',category:category.trim(),cover:cover.trim()}).eq('id',id);if(r.error)throw r.error;await refreshGames();renderAdmin();}catch(e){alert('Could not update game: '+(e.message||'unknown error'));}}
async function saveGame(){var title=val('t').trim(),html=val('gc');if(!title)return say('Please add a title.','err');if(!html.trim())return say('Please add a game file or paste its HTML.','err');if(new Blob([html]).size>MAX)return say('That game is over 230 KB. Try minifying it or inlining fewer assets.','err');var btn=document.getElementById('save');btn.disabled=true;say('Publishing…');try{var emoji=val('em').trim()||'🕹️',category=val('cat').trim(),cover='';var cf=document.getElementById('cv').files[0];if(cf){if(cf.size>700000){throw new Error('Cover image must be smaller than 700 KB.');}cover=await new Promise(function(resolve,reject){var rd=new FileReader();rd.onload=function(){resolve(rd.result);};rd.onerror=reject;rd.readAsDataURL(cf);});}var id='g'+Date.now().toString(36);var gr=await supabase.from('games').insert({id:id,title:title,description:val('d').trim(),emoji:emoji,category:category,cover:cover});if(gr.error)throw gr.error;var fr=await supabase.from('gamefiles').insert({game_id:id,html:html});if(fr.error){await supabase.from('games').delete().eq('id',id);throw fr.error;}say('Published! It’s live on the home page.','ok');await refreshGames();renderAdmin();say('Published! It’s live on the home page.','ok');}catch(e){say('Couldn’t publish: '+(e.message||'unknown error'),'err');btn.disabled=false;}}
async function delGame(id){if(!confirm('Delete this game for good?'))return;try{var a=await supabase.from('gamefiles').delete().eq('game_id',id);if(a.error)throw a.error;var b=await supabase.from('games').delete().eq('id',id);if(b.error)throw b.error;await refreshGames();renderAdmin();}catch(e){alert('Couldn’t delete: '+(e.message||'error'));}}
async function refreshGames(){var cr=await supabase.from('game_categories').select('name').order('name');if(!cr.error)state.categories=(cr.data||[]).map(function(x){return x.name;});var r=await supabase.from('games').select('id,title,description,emoji,cover,category,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;state.games=(r.data||[]).map(function(g){return Object.assign({emoji:'🕹️',cover:''},g);});state.ready=true;state.error='';}
function goHome(){state.view='home';state.current=null;render();}
accountBtn.onclick=function(){state.signup=false;renderLogin();};document.getElementById('logo').onclick=goHome;adminBtn.onclick=function(){state.view=state.view==='admin'?'home':'admin';render();};document.getElementById('scoresBtn').onclick=function(){state.view='leaderboard';render();};document.getElementById('outBtn').onclick=logout;profBtn.onclick=function(){state.view='profile';render();};
render();
(async function init(){try{if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase library did not load. Check your internet connection.');supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});var session=await supabase.auth.getSession();if(session.error)throw session.error;if(session.data.session)await loadMe(session.data.session.user);await refreshGames();renderHome();}catch(e){state.ready=true;state.error='Couldn’t connect to DPS Games: '+(e.message||'unknown error');render();}supabase&&supabase.auth.onAuthStateChange(function(event,session){if(event==='SIGNED_OUT'){state.me=null;state.profile=null;state.profileData=null;render();}});})();
})();
</script>
